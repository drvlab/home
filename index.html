<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRV Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #07041a;
    overflow: hidden;
    cursor: none;
  }

  .cursor {
    position: fixed; width: 8px; height: 8px; background: #fff;
    border-radius: 50%; pointer-events: none; z-index: 9999;
    mix-blend-mode: difference; transition: transform 0.15s ease;
  }
  .cursor-ring {
    position: fixed; width: 32px; height: 32px;
    border: 1px solid rgba(255,255,255,0.4); border-radius: 50%;
    pointer-events: none; z-index: 9998;
    transition: transform 0.3s ease, width 0.3s, height 0.3s, border-color 0.3s;
    transform: translate(-12px,-12px);
  }
  .cursor-ring.hover {
    width: 60px; height: 60px; transform: translate(-22px,-22px);
    border-color: rgba(180,80,255,0.7);
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    opacity: 0.12; pointer-events: none; z-index: 1;
  }

  .bg-glow {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(120,40,220,0.22) 0%, rgba(30,10,80,0.18) 50%, transparent 75%);
    pointer-events: none; z-index: 0;
  }

  .scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px);
    pointer-events: none; z-index: 2;
  }

  /* ── Main container ── */
  .container {
    position: relative; z-index: 10; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0;
  }

  /* ── Top label area ── */
  .label-area {
    margin-bottom: 3.5rem;
    height: clamp(26px, 2.8vw, 42px);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  .label-scritta {
    opacity: 0;
    animation: fadeUp 1.2s ease 0.3s forwards;
    transition: opacity 0.7s ease;
    position: absolute;
  }
  .label-scritta img {
    width: clamp(26px, 2.8vw, 42px);
    height: auto; display: block;
  }

  .label-scritta.clickable {
    cursor: none;
  }
  .label-scritta.clickable img {
    opacity: 0.6;
    transition: opacity 0.3s ease;
  }
  .label-scritta.clickable:hover img {
    opacity: 1;
  }

  /* ── Logo circle ── */
  .logo-link {
    display: block; position: relative;
    width: clamp(220px, 38vmin, 420px);
    height: clamp(220px, 38vmin, 420px);
    border-radius: 50%; text-decoration: none;
    opacity: 0; animation: fadeIn 1.4s ease 0.6s forwards;
    transition: transform 0.6s cubic-bezier(0.16,1,0.3,1);
    overflow: visible;
  }
  .logo-link:hover { transform: scale(1.04); }
  .logo-link::before {
    content: ''; position: absolute; inset: -12px; border-radius: 50%;
    border: 1px solid rgba(180,80,255,0);
    transition: border-color 0.5s ease, inset 0.5s ease;
  }
  .logo-link:hover::before { inset: -20px; border-color: rgba(180,80,255,0.35); }
  .logo-link::after {
    content: ''; position: absolute; inset: -30px; border-radius: 50%;
    border: 1px solid rgba(180,80,255,0);
    transition: border-color 0.7s ease 0.1s, inset 0.7s ease 0.1s;
  }
  .logo-link:hover::after { inset: -44px; border-color: rgba(180,80,255,0.15); }

  /* Radar rings */
  .logo-link.releases-mode .radar-ring {
    animation-play-state: paused;
    opacity: 0 !important;
    transition: opacity 0.5s ease;
  }

  .cover-glow {
    position: absolute; inset: -18px;
    background: radial-gradient(ellipse at center, rgba(200,100,255,0.18) 0%, transparent 68%);
    opacity: 0; pointer-events: none; z-index: 6;
    transition: opacity 0.45s ease;
  }
  .logo-link.releases-mode:hover .cover-glow { opacity: 1; }

  .radar-ring {
    position: absolute; border-radius: 50%;
    border: 1px solid rgba(160,80,255,0.55);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(1);
    width: 100%; height: 100%; opacity: 0;
    pointer-events: none; z-index: 1;
    animation: radarPulse 3.6s ease-out infinite;
  }
  .radar-ring:nth-child(2) { animation-delay: 1.2s; }
  .radar-ring:nth-child(3) { animation-delay: 2.4s; }

  @keyframes radarPulse {
    0%   { transform: translate(-50%,-50%) scale(1);   opacity: 0.65; }
    100% { transform: translate(-50%,-50%) scale(2.9); opacity: 0; }
  }

  .radar-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border-radius: 50%; z-index: 3; pointer-events: none;
    transition: opacity 0.8s ease;
  }

  /* Photo on hover */
  .logo-img-wrap {
    position: absolute; inset: 0; z-index: 2;
    border-radius: 50%; overflow: hidden; opacity: 0;
    transition: opacity 12s ease;
  }
  .logo-img {
    width: 100%; height: 100%; border-radius: 50%; display: block;
    object-fit: cover; filter: brightness(1.05) saturate(1.1);
    transition: filter 1.5s ease, transform 0.6s ease;
  }
  .logo-img.distorting { filter: brightness(1.15) saturate(1.25) url(#gravity); }

  /* Cover images inside circle */
  .cover-wrap {
    position: absolute; inset: 0; z-index: 4;
    border-radius: 0; overflow: hidden;
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .cover-wrap.active {
    opacity: 1; pointer-events: all;
  }
  .cover-wrap img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }

  .logo-spin {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 70%, rgba(180,80,255,0.06) 100%);
    animation: spinSlow 20s linear infinite;
    pointer-events: none; z-index: 5;
  }

  /* ── Bottom info area ── */
  .release-info {
    margin-top: 3.2rem;
    display: flex; flex-direction: column; align-items: center;
    gap: 0.35rem;
    opacity: 0;
    transition: opacity 0.7s ease;
    pointer-events: none;
    min-height: 4rem;
  }
  .release-info.visible {
    opacity: 1; pointer-events: all;
  }

  .rel-nav {
    display: flex; align-items: center; gap: 2.4rem; margin-bottom: 0.8rem;
  }
  .rel-arrow {
    background: none; border: none;
    font-family: 'Space Mono', monospace;
    font-size: clamp(16px, 2vw, 22px);
    color: rgba(180,80,255,0.3); cursor: none;
    padding: 0.2em 0.8em;
    transition: color 0.3s ease, opacity 0.3s ease;
  }
  .rel-arrow:hover { color: rgba(210,140,255,0.85); }
  .rel-arrow.hidden { opacity: 0; pointer-events: none; }

  .rel-dots {
    display: flex; gap: 0.5rem; align-items: center;
  }
  .rel-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(180,80,255,0.25);
    transition: background 0.3s ease;
  }
  .rel-dot.active { background: rgba(180,80,255,0.7); }

  .rel-artist {
    font-family: 'Space Mono', monospace;
    font-size: clamp(8px, 0.85vw, 10px);
    letter-spacing: 0.32em; color: rgba(180,80,255,0.55);
    text-transform: uppercase; text-decoration: none;
    transition: color 0.3s ease; cursor: none;
  }
  .rel-artist:hover { color: rgba(210,140,255,0.9); }

  .rel-title {
    font-family: 'Syncopate', sans-serif; font-weight: 700;
    font-size: clamp(12px, 1.5vw, 17px); letter-spacing: 0.1em;
    color: rgba(255,255,255,0.88); text-transform: uppercase;
    text-decoration: none; cursor: none;
    transition: color 0.3s ease;
  }
  .rel-title:hover { color: #fff; }

  .rel-type {
    font-family: 'Space Mono', monospace;
    font-size: clamp(7px, 0.75vw, 9px);
    letter-spacing: 0.3em; color: rgba(255,255,255,0.18);
    text-transform: uppercase; margin-top: 0.1rem;
  }

  /* ── Shared animations ── */
  @keyframes fadeIn  { from { opacity:0; transform:scale(0.94); } to { opacity:1; transform:scale(1); } }
  @keyframes fadeUp  { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes spinSlow { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
</style>
</head>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="gravity" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">

      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feComposite in="displaced" in2="SourceGraphic" operator="in"/>

  </defs>
</svg>

<script>
  // Release data
  const releases = [
    { title: 'The Other Thing', link: 'https://go.protonradio.com/r/rlczUKH09OGus' },
    { title: 'Legni',           link: 'https://go.protonradio.com/r/rlrISDt_zMUC4' },
    { title: 'Cieli',           link: 'https://found.ee/aLZPpH' }
  ];

  // --- Cursor ---
  const cursor = document.getElementById('cursor');
  const ring   = document.getElementById('cursorRing');
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove', e => {
    mx=e.clientX; my=e.clientY;
    cursor.style.transform = `translate(${mx-4}px,${my-4}px)`;
  });
  (function animRing(){
    rx+=(mx-rx)*0.1; ry+=(my-ry)*0.1;
    ring.style.left=rx+'px'; ring.style.top=ry+'px';
    requestAnimationFrame(animRing);
  })();
  document.querySelectorAll('a, button').forEach(el => {
    el.addEventListener('mouseenter', () => ring.classList.add('hover'));
    el.addEventListener('mouseleave', () => ring.classList.remove('hover'));
  });

  // --- Radar canvas ---
  const logoLink    = document.getElementById('logoLink');
  const radarCanvas = document.getElementById('radarCanvas');

  function resizeRadar() {
    const rect = logoLink.getBoundingClientRect();
    const s = Math.round(rect.width);
    const dpr = window.devicePixelRatio||1;
    radarCanvas.width  = s*dpr; radarCanvas.height = s*dpr;
    radarCanvas.style.width = s+'px'; radarCanvas.style.height = s+'px';
  }
  window.addEventListener('load', resizeRadar);
  resizeRadar();
  window.addEventListener('resize', resizeRadar);

  let sweepAngle=-Math.PI/2, lastTs=null;
  const SWEEP_PERIOD=9000;

  function drawSweep(ts) {
    if(!lastTs) lastTs=ts;
    const dt=ts-lastTs; lastTs=ts;
    sweepAngle += (dt/SWEEP_PERIOD)*Math.PI*2;
    const dpr=window.devicePixelRatio||1;
    const s=radarCanvas.width/dpr;
    const cx=s/2,cy=s/2,r=s/2-1;
    const ctx=radarCanvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,s,s);
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
    const stepRad=(10/180)*Math.PI, steps=6;
    for(let i=steps;i>=1;i--){
      const a1=sweepAngle-i*stepRad, a2=sweepAngle-(i-1)*stepRad;
      const alpha=(1-i/(steps+1))*0.16;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a1,a2); ctx.closePath();
      ctx.fillStyle=`rgba(160,60,255,${alpha.toFixed(3)})`; ctx.fill();
    }
    const brightRad=(12/180)*Math.PI;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,sweepAngle-brightRad,sweepAngle); ctx.closePath();
    const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    grd.addColorStop(0,'rgba(180,80,255,0.0)'); grd.addColorStop(1,'rgba(200,120,255,0.28)');
    ctx.fillStyle=grd; ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(sweepAngle)*r, cy+Math.sin(sweepAngle)*r);
    ctx.strokeStyle='rgba(210,130,255,0.9)'; ctx.lineWidth=1.5;
    ctx.shadowColor='rgba(200,100,255,0.8)'; ctx.shadowBlur=6;
    ctx.stroke(); ctx.shadowBlur=0;
    ctx.restore();
    requestAnimationFrame(drawSweep);
  }
  requestAnimationFrame(drawSweep);

  // --- Logo hover (home mode only) ---
  const logoWrap = document.getElementById('logoWrap');
  const logoImg  = document.getElementById('logoImg');
  const turbulence   = document.getElementById('turbulence');
  const displacement = turbulence ? turbulence.nextElementSibling : null;
  let warpScale=0, warpTarget=0, hideTimer=null, photoVisible=false;
  let inReleases = false;

  function showPhoto(){
    if(inReleases) return;
    clearTimeout(hideTimer); photoVisible=true;
    logoWrap.style.transition='opacity 12s ease'; logoWrap.style.opacity='1';
    radarCanvas.style.transition='opacity 12s ease'; radarCanvas.style.opacity='0';
  }
  function startHideTimer(){
    clearTimeout(hideTimer);
    hideTimer=setTimeout(()=>{
      if(inReleases) return;
      photoVisible=false; warpTarget=0;
      logoImg.classList.remove('distorting');
      logoWrap.style.transition='opacity 14s ease'; logoWrap.style.opacity='0';
      radarCanvas.style.transition='opacity 14s ease'; radarCanvas.style.opacity='1';
    },10000);
  }
  logoLink.addEventListener('mouseenter',()=>{ if(inReleases) return; showPhoto(); warpTarget=28; logoImg.classList.add('distorting'); ring.classList.add('hover'); });
  logoLink.addEventListener('mouseleave',()=>{ if(inReleases) return; warpTarget=0; logoImg.classList.remove('distorting'); ring.classList.remove('hover'); if(photoVisible) startHideTimer(); });
  logoLink.addEventListener('mousemove', ()=>{ if(!inReleases && photoVisible){ clearTimeout(hideTimer); startHideTimer(); } });

  function animateWarp(){
    warpScale+=(warpTarget-warpScale)*0.07;
    if(displacement) displacement.setAttribute('scale',warpScale.toFixed(2));
    const bf=0.015+Math.sin(Date.now()*0.0004)*0.004;
    if(turbulence) turbulence.setAttribute('baseFrequency',`${bf.toFixed(4)} ${(bf*0.7).toFixed(4)}`);
    requestAnimationFrame(animateWarp);
  }
  animateWarp();

  // --- Logo pulse ---
  const RING_DURATION=3600, RING_DELAYS=[0,1200,2400];
  function schedulePulses(){
    RING_DELAYS.forEach(delay=>{ function fire(){ pulseImage(); setTimeout(fire,RING_DURATION); } setTimeout(fire,delay); });
  }
  schedulePulses();
  let pulsing=false;
  function pulseImage(){
    if(pulsing||inReleases) return; pulsing=true;
    logoImg.style.transition='transform 0.6s cubic-bezier(0.25,0,0.1,1), filter 0.6s ease-out';
    logoImg.style.transform='scale(1.025)'; logoImg.style.filter='brightness(1.18) saturate(1.3)';
    setTimeout(()=>{ logoImg.style.transition='transform 1.1s cubic-bezier(0.1,0,0.25,1), filter 1.1s ease-in'; logoImg.style.transform='scale(1)'; logoImg.style.filter='brightness(1.05) saturate(1.1)'; setTimeout(()=>{pulsing=false;},1100); },600);
  }

  // --- Releases mode ---
  const labelScritta = document.getElementById('labelScritta');

  const releaseInfo  = document.getElementById('releaseInfo');
  const relTitle     = document.getElementById('relTitle');
  const relPrev      = document.getElementById('relPrev');
  const relNext      = document.getElementById('relNext');
  const dots         = document.querySelectorAll('.rel-dot');
  const covers       = document.querySelectorAll('.cover-wrap');
  let currentIdx = 0;

  function enterReleases(){
    inReleases = true;
    clearTimeout(hideTimer);
    // Fade out photo + radar
    logoWrap.style.transition='opacity 0.6s ease'; logoWrap.style.opacity='0';
    radarCanvas.style.transition='opacity 0.6s ease'; radarCanvas.style.opacity='0';
    warpTarget=0; logoImg.classList.remove('distorting');
    // Swap label
    labelScritta.classList.add('clickable');
    logoLink.classList.add('releases-mode');
    // Show first cover + info
    showRelease(0);
    releaseInfo.classList.add('visible');
    logoLink.style.cursor='default';
  }

  function exitReleases(){
    inReleases = false;
    // Hide all covers
    covers.forEach(c=>c.classList.remove('active'));
    releaseInfo.classList.remove('visible');
    // Swap label back
    labelScritta.classList.remove('clickable');
    logoLink.classList.remove('releases-mode');
    // Restore radar
    radarCanvas.style.transition='opacity 1s ease'; radarCanvas.style.opacity='1';
    photoVisible=false; currentIdx=0;
    logoLink.style.cursor='';
  }

  function showRelease(idx){
    covers.forEach(c=>c.classList.remove('active'));
    covers[idx].classList.add('active');
    dots.forEach((d,i)=>d.classList.toggle('active',i===idx));
    relTitle.textContent = releases[idx].title;
    relTitle.href = releases[idx].link;
    relPrev.classList.toggle('hidden', idx===0);
    relNext.classList.toggle('hidden', idx===releases.length-1);
    currentIdx=idx;
  }

  logoLink.addEventListener('click', e=>{
    e.preventDefault();
    if(!inReleases) enterReleases();
  });
  labelScritta.addEventListener('click', ()=>{ if(inReleases) exitReleases(); });
  relPrev.addEventListener('click', ()=>{ if(currentIdx>0) showRelease(currentIdx-1); });
  relNext.addEventListener('click', ()=>{ if(currentIdx<releases.length-1) showRelease(currentIdx+1); });
</script>
</body>
</html>
